<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Presentation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- THREE IMAGES -->
        <main class="photo-grid">

            <div class="photo-card">
                <img id="image1" src="" alt="Photo 1">
            </div>

            <div class="photo-card">
                <img id="image2" src="" alt="Photo 2">
            </div>

            <div class="photo-card">
                <img id="image3" src="" alt="Photo 3">
            </div>

        </main>


        <!-- TEXT -->
        <section class="description">
            <p id="description"></p>
        </section>


        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
